enabled: true

# blacklist: enabled in every world except those listed below.
# whitelist: enabled only in the worlds listed below.
worlds:
  mode: blacklist
  list: []

# hotbar: search slots 0-8; inventory: search the entire player storage inventory.
# Please note that use inventory mode will cost ~x5 extra performance, don't recommended to use it.
search-scope: hotbar

# Minimum interval between detections for the same player.
cooldown-ticks: 5

# Candidate score:
# block destroy speed (including efficiency) * multiplier ^ fortune level
# Fortune only receives this bonus when the item is a preferred tool for the block.
fortune-multiplier-per-level: 1.5

# Optional trigger filters. Leave both filters disabled to preserve the original behavior.
trigger:
  # Only switch when the selected tool mines this block faster than an empty hand.
  require-effective-tool: false
  # -1 disables the hardness filter. Vanilla examples: dirt 0.5, stone 1.5, obsidian 50.
  min-block-hardness: -1.0
  # any: either enabled filter may pass; all: every enabled filter must pass.
  mode: any

conditions: []

# Executed after the held hotbar slot is changed.
switch-actions: []
